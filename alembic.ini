[alembic]
script_location = migrations
prepend_sys_path = src
# sqlalchemy.url is intentionally absent: migrations/env.py reads BAAKI_MIGRATE_DSN from the
# environment and refuses to run unless session_user = baaki_migrate.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
