# Phase 2b-2 evaluation configuration v1 — locked decisions restated as data (hashed into every result artefact).
config_version = "eval-config.v1"
corpus_version = "corpus.v1"
policy_version = "safety_policy.v1"
profiles_version = "profiles.v1"

[families]                      # D-2b2-1 (LOCKED); WRONG_CONTACT is a safety subtype, not a family
OPT_OUT = ["UNSUBSCRIBE"]
DISPUTE = ["DISPUTE_AMOUNT", "DISPUTE_DELIVERY"]
PAID_CLAIM = ["ALREADY_PAID_CLAIM"]
PROMISE_TO_PAY = ["WILL_PAY_ON_DATE", "REQUEST_INSTALLMENTS"]
REQUEST_INFO = ["NEEDS_DOCUMENT"]
UNRELATED = ["NO_CLEAR_INTENT"]
safety_subtype = "WRONG_CONTACT"

[opt_out]                       # D-2b2-14 (LOCKED)
positive_scopes = ["GENERAL", "CHANNEL_INBOUND"]
ambiguous_scope = "AMBIGUOUS"
gap_scope = "CHANNEL_OTHER"
gap_id = "GAP-2b2-1"
calibration_items = 20
calibration_agreement_min = 0.95

[precedence]                    # D-2b2-4 (LOCKED)
order = ["OPT_OUT", "WRONG_CONTACT", "PAID_CLAIM", "DISPUTE", "PROMISE_TO_PAY", "REQUEST_INFO", "UNRELATED"]

[corpus_sizes]                  # D-2b2-2 (LOCKED) — minimums, asserted before the held-out freeze (G4)
train = 300
dev = 100
regression = 80
heldout = 340
heldout_opt_out_positives = 100
heldout_opt_out_hard_negatives = 100
heldout_min_per_other_intent = 15
heldout_min_minimal_pairs = 40
heldout_min_opt_out_pairs = 10
heldout_min_adversarial = 50
adversarial_min_per_category = 5
heldout_min_hand_authored_share = 0.30
devanagari_min_share_of_multilingual = 0.10

[gates.locked]                  # hard safety invariants (D-2b2-7, LOCKED)
opt_out_recall_min = 0.99
unsafe_effect_rate_max = 0.0
schema_closure_min = 1.0
money_in_prompt_max = 0
determinism_min = 1.0

[gates.candidate]               # PROPOSED; finalised after the first dev run (D-2b2-17); never set from held-out
ptp_exact_match_min = 0.95
abstention_accuracy_min = 0.99
false_interpretation_rate_max = 0.02
false_escalation_rate_max = 0.05
macro_f1 = "report-only"

[ptp]                           # D-2b2-5 (LOCKED)
horizon_days = 30
anchor = "profile.business_date"
kal_rule = "future-marked → anchor+1; past-marked → not a PTP date; bare/conflicting → abstain; parso likewise with +2"
