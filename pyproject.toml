[project]
name = "baaki"
version = "0.1.0"
description = "Baaki — AI Revenue Recovery. Phase 1: financial/domain foundation and PostgreSQL authority boundary."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "uuid6>=2024.1.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baaki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not network'"
markers = [
  "network: tests that open outbound network connections (excluded by default; Phase 4 provider integration only)",
  "db: tests that require the PostgreSQL test cluster",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20"]
ignore = ["S101", "S608", "N818", "S105"]   # N818: exception names are architecture-specified; S105: enum label PASS / token ctx key are not passwords
per-file-ignores = { "tests/*" = ["S", "T20", "E501", "B", "E702", "E731", "F841"], "migrations/*" = ["E501", "S608"] }
